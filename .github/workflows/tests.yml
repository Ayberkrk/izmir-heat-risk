name: Testler

# Her push ve PR'da tests/ altındaki pytest suite'ini çalıştırır - README'nin
# "Testler" bölümünde belgelenen doğrulama adımı, katkılar (ör. yeni bir
# şehir adaptörü) merge edilmeden önce otomatik uygulanır.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: pytest
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker imajını build et
        run: docker build -t izmir-heat-risk .

      # Gerçek pipeline'ı (Landsat/OSM indirmesi, dakikalarca sürer) CI'da
      # çalıştırmıyoruz - sadece imajın modülü sağlam kurduğunu, network
      # gerektirmeden doğrulayan hafif bir duman testi.
      - name: İçe aktarma duman testi
        run: docker run --rm --entrypoint python izmir-heat-risk -c "import pipeline"
